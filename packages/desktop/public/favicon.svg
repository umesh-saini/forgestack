<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="12" />

  <!-- Subtle Inner Glow Ring -->
  <rect x="48" y="48" width="928" height="928" rx="204" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Center Layer 3 (Bottom Stack) -->
  <path d="M 512 620 L 760 480 L 760 520 L 512 660 L 264 520 L 264 480 Z" fill="#1e293b" stroke="#334155" stroke-width="6" opacity="0.8" />
  
  <!-- Center Layer 2 (Middle Stack) -->
  <path d="M 512 520 L 760 380 L 760 420 L 512 560 L 264 420 L 264 380 Z" fill="url(#accentGrad)" opacity="0.85" />

  <!-- Center Layer 1 (Top Forge Diamond Plate) -->
  <g filter="url(#glow)">
    <polygon points="512,260 760,390 512,520 264,390" fill="url(#primaryGrad)" stroke="#67e8f9" stroke-width="8" />
  </g>

  <!-- Inner Geometric Matrix Lines on Top Layer -->
  <line x1="512" y1="260" x2="512" y2="520" stroke="#ffffff" stroke-width="6" stroke-opacity="0.4" />
  <line x1="388" y1="325" x2="636" y2="455" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3" />
  <line x1="636" y1="325" x2="388" y2="455" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3" />

  <!-- Spark / Forge Flame Icon at Apex -->
  <circle cx="512" cy="230" r="18" fill="url(#sparkGrad)" filter="url(#glow)" />
  <polygon points="512,180 524,220 512,240 500,220" fill="#fbbf24" />
</svg>
