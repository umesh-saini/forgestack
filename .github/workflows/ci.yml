name: CI & Permutation Matrix

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Build, Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build all packages
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run unit & E2E tests
        run: pnpm run test

  e2e-matrix:
    name: Curated Templates Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies & Build CLI
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Scaffold, install & build every curated template
        run: scripts/verify-templates.sh

  static-matrix:
    name: Every Option Combination (static integrity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies & Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Generate & check every combination of interacting options
        run: pnpm test:matrix

  runtime-matrix:
    name: Pairwise Runtime Matrix (install, build, start, HTTP probes)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies & Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install, build, migrate, start & probe every pairwise config
        run: node scripts/matrix/runtime.mjs --jobs 2 --out runtime-matrix

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-matrix
          path: |
            runtime-matrix/*.log
            runtime-matrix/report.md
